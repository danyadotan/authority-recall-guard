name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  moss-eval:
    runs-on: ubuntu-latest
    env:
      MOSS_PROJECT_ID: ${{ secrets.MOSS_PROJECT_ID }}
      MOSS_PROJECT_KEY: ${{ secrets.MOSS_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Moss retrieval eval
        if: env.MOSS_PROJECT_ID != '' && env.MOSS_PROJECT_KEY != ''
        run: npm run eval
